<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kroniky rodů — rodokmeny fantasy světů</title>
<meta name="description" content="Tvorba nekonečných rodokmenů pro fantasy světy: větvení, propojování rodů, export do obrázku A5.">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌳</text></svg>">
</head>
<body data-theme="pergamen">

<div id="app">
  <div id="stage"></div>

  <!-- horní lišta -->
  <header class="topbar">
    <button id="btn-trees" class="chip-btn" title="Rody a stromy (T)">
      <span class="chip-ico" data-icon="trees"></span>
      <span class="chip-txt">
        <strong id="tree-name">Rod</strong>
        <em id="focus-name">—</em>
      </span>
    </button>
  </header>

  <!-- předci -->
  <div class="rail rail-tl">
    <div class="rail-title">Předci</div>
    <div class="rail-group" id="rail-up"></div>
  </div>

  <!-- potomci -->
  <div class="rail rail-bl">
    <div class="rail-group" id="rail-down"></div>
    <div class="rail-title">Potomci</div>
  </div>

  <!-- nástroje -->
  <div class="rail rail-tr">
    <button class="tool" data-act="settings" title="Nastavení"><span data-icon="gear"></span></button>
    <button class="tool" data-act="search" title="Najít osobu (F)"><span data-icon="search"></span></button>
    <button class="tool" data-act="export" title="Uložit jako obrázek"><span data-icon="image"></span></button>
    <button class="tool" data-act="undo" title="Zpět (Ctrl+Z)"><span data-icon="undo"></span></button>
  </div>

  <div class="rail rail-br">
    <button class="tool" data-act="zoom-in" title="Přiblížit"><span data-icon="plus"></span></button>
    <button class="tool" data-act="zoom-out" title="Oddálit"><span data-icon="minus"></span></button>
    <button class="tool" data-act="fit" title="Zobrazit celý strom (0)"><span data-icon="fit"></span></button>
    <button class="tool" data-act="center" title="Na zaměřenou osobu (C)"><span data-icon="focus"></span></button>
  </div>

  <div id="hint" class="hint"></div>
  <div id="toasts"></div>
</div>

<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/view.js"></script>
<script src="js/export.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
